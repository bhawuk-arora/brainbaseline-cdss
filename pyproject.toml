[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainbaseline"
version = "0.1.0"
description = "BrainBaseline: Deterministic Longitudinal Cognitive Health Screening Platform"
authors = [{ name = "BrainBaseline Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "sqlmodel>=0.0.16",
    "uvicorn>=0.28.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "sim*"]
